# =============================================================================
# Taskfile.yml — go-task v3
# =============================================================================
# Developer workflow for the authentik identity-broker PoC.
# Install go-task: https://taskfile.dev/installation/
# Run tasks with: task <name>
# =============================================================================
#
# SERVICE HEALTH NOTES:
#   authentik-server has start_period: 120s; full stack can take ~180s to become
#   healthy on a cold start.  `task dev` waits up to 180s via scripts/wait-healthy.sh.
#
# GENERATED CODE:
#   api/internal/oapi/       — regenerated by `task api:generate` (also runs inside
#                              the API Docker build via the Dockerfile).
#   spa/src/api/schema.d.ts  — regenerated inside the SPA Docker build only.
#   `dev:clean` does NOT delete generated code; it is regenerated on the next
#   `task dev` / `docker compose build`.  This keeps editor tooling and
#   `go test` working between stack restarts without an extra codegen step.
#
# DEMO CREDENTIALS (LOCAL/DEMO ONLY — never reuse outside this PoC):
#   alice@example.com / password   (groups: admins)
#   bob@example.com   / password   (groups: users)
#   akadmin@localhost / akadmin-local-demo-password  (break-glass admin)
# =============================================================================

version: "3"

vars:
  COMPOSE: docker compose

tasks:

  # ---------------------------------------------------------------------------
  # dev — bring up the full stack (idempotent)
  # ---------------------------------------------------------------------------
  # Safe to run repeatedly on an already-up stack.  docker compose build and
  # up -d are both idempotent; the health-wait script exits immediately when
  # all services already report "healthy".
  #
  # Steps:
  #   1. api:generate   — regenerate api/internal/oapi/ from the OpenAPI spec.
  #                       (SPA schema is regenerated inside its Docker build.)
  #   2. compose build  — build/refresh all images (cached layers reused).
  #   3. compose up -d  — start or reconcile running containers.
  #   4. wait-healthy   — poll until every service with a healthcheck is healthy
  #                       (timeout 180s; see scripts/wait-healthy.sh).
  #   5. Print URL table and demo credentials.
  # ---------------------------------------------------------------------------
  dev:
    desc: "Build images, start full stack, wait for health, print URLs and demo creds"
    cmds:
      - task: api:generate
      - "{{.COMPOSE}} build"
      - "{{.COMPOSE}} up -d"
      - sh scripts/wait-healthy.sh 180 5
      - |
        echo ""
        echo "============================================================"
        echo "  Stack is UP and healthy"
        echo "============================================================"
        echo ""
        echo "  URLs:"
        echo "    http://app.localhost:8000/      -> SPA (React)"
        echo "    http://app.localhost:8000/api/  -> Go API"
        echo "    http://auth.localhost:8000/     -> authentik UI + OIDC"
        echo "    http://idp.localhost:8000/      -> Dex (upstream IdP)"
        echo "    http://traefik.localhost:8000/  -> Traefik dashboard"
        echo ""
        echo "  Demo users (LOCAL/DEMO ONLY):"
        echo "    alice@example.com / password   (groups: admins)"
        echo "    bob@example.com   / password   (groups: users)"
        echo ""
        echo "  Break-glass admin:"
        echo "    akadmin@localhost / akadmin-local-demo-password"
        echo "============================================================"

  # ---------------------------------------------------------------------------
  # dev:clean — tear down everything; idempotent
  # ---------------------------------------------------------------------------
  # Removes containers, volumes, and orphan containers.
  # Generated code (api/internal/oapi/, spa/src/api/schema.d.ts) is NOT
  # deleted here — it is regenerated on the next `task dev` / compose build.
  # This keeps the working tree usable for `go test` and editor tooling
  # between stack restarts.
  #
  # Running on an already-down stack is safe (docker compose down is idempotent).
  # ---------------------------------------------------------------------------
  dev:clean:
    desc: "Tear down full stack: containers, volumes, orphans removed (idempotent)"
    cmds:
      - "{{.COMPOSE}} down -v --remove-orphans"

  # ---------------------------------------------------------------------------
  # validate — infra + curl checks + Go API tests + E2E placeholder
  # ---------------------------------------------------------------------------
  # Phase 3 implements:
  #   - Host-port assertion (only traefik may expose host ports)
  #   - Hostname routing curl checks (SPA, authentik, Dex discovery, API 401)
  #   - Go API unit/integration tests (via `task test`)
  #
  # Phase 4 wires real Playwright E2E (via `task test:e2e`).
  # For now, test:e2e exits 0 (clearly-marked stub).
  # ---------------------------------------------------------------------------
  validate:
    desc: "Run infra checks, curl smoke tests, Go API tests; E2E stub (Phase 4)"
    cmds:
      - sh scripts/validate.sh
      - echo ""
      - echo "[ Go API tests ] running task test..."
      - task: test
      - echo "  [PASS] Go API tests"
      - echo ""
      # Phase 4 wires real E2E here
      - echo "[ E2E ] calling task test:e2e (Phase 4 wires real Playwright here)"
      - task: test:e2e
      - echo ""
      - echo "============================================================"
      - 'echo "  validate: ALL CHECKS PASSED"'
      - echo "============================================================"

  # ---------------------------------------------------------------------------
  # logs — tail all compose service logs
  # ---------------------------------------------------------------------------
  logs:
    desc: "Follow logs for all compose services"
    cmds:
      - "{{.COMPOSE}} logs -f"

  # ---------------------------------------------------------------------------
  # test — regenerate ogen code, then run Go API tests
  # ---------------------------------------------------------------------------
  # api:generate runs first so a fresh clone with no pre-generated code still
  # works.  Go tests cover all API handlers (22 tests as of Phase 2a).
  # ---------------------------------------------------------------------------
  test:
    desc: "Regenerate ogen code then run Go API unit/integration tests"
    cmds:
      - task: api:generate
      - cd api && go test ./...

  # ---------------------------------------------------------------------------
  # api:generate — regenerate ogen code from the OpenAPI spec
  # ---------------------------------------------------------------------------
  # Run after editing api/openapi/openapi.yaml.
  # Output: api/internal/oapi/ (gitignored; also regenerated by the API
  # Dockerfile so the Docker build is always in sync).
  # ---------------------------------------------------------------------------
  api:generate:
    desc: "Regenerate ogen code from api/openapi/openapi.yaml"
    cmds:
      - cd api && go run github.com/ogen-go/ogen/cmd/ogen --target ./internal/oapi --package oapi --clean ./openapi/openapi.yaml

  # ---------------------------------------------------------------------------
  # test:e2e — Playwright E2E + API negative/positive tests (Phase 4)
  # ---------------------------------------------------------------------------
  # Steps:
  #   1. npm ci in tests/ (idempotent; uses package-lock.json)
  #   2. Install Playwright chromium browser (skips if already installed)
  #   3. Run test-infrastructure setup script (idempotent; fixes blueprint gap:
  #      adds Dex source to the authentik identification stage so "Login with Dex"
  #      button appears — see tests/scripts/setup-authentik.js for details)
  #   4. Run Playwright tests (E2E browser flow + API negative/positive suite)
  #
  # Tests:
  #   tests/api-negative.spec.ts — 6 API negative cases (no auth needed)
  #   tests/api-auth.spec.ts     — API positive case (requires full OIDC login)
  #   tests/e2e-login.spec.ts    — Full brokered login E2E via browser
  #
  # Blueprint gap note (see scripts/setup-authentik.js):
  #   Blueprint 30-sources.yaml does not bind the Dex source to the authentik
  #   identification stage. The setup script applies this fix via the admin API.
  #   The orchestrator should permanently fix this in the blueprint.
  # ---------------------------------------------------------------------------
  test:e2e:
    desc: "Run Playwright E2E + API tests (Phase 4): installs deps, fixes blueprint gap, runs suite"
    cmds:
      - cd tests && npm ci
      - cd tests && npx playwright install chromium
      - node tests/scripts/setup-authentik.js
      - cd tests && npx playwright test
