# nginx configuration for the SPA.
#
# Key requirements (CONTRACT §7):
#   - Container listens on port 80.
#   - SPA fallback: all unknown paths serve index.html so /callback, /silent-renew,
#     and any client-side route work correctly.
#   - Healthcheck endpoint: GET / returns 200 (index.html), which is what Traefik v3
#     uses to determine container health. The compose healthcheck uses `wget --spider`
#     on http://localhost:80/ which succeeds on any 200 response.
#
# Traefik v3 Docker provider excludes containers whose healthcheck is not passing
# (exit code != 0). nginx serves index.html at / with a 200, so the healthcheck
# succeeds as soon as nginx is up.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # SPA fallback — every path that doesn't match a real file falls through to
    # index.html. This allows /callback, /silent-renew, and any future route to
    # work even though they have no server-side counterpart.
    location / {
        try_files $uri /index.html;
    }

    # Cache fingerprinted assets aggressively; Vite adds content hashes to filenames.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache index.html so the browser always fetches the latest shell.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
